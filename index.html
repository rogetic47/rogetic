<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rogetic Chess Lab - Escacs Multimode</title>
    <!-- Chess.js library for rule validation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --accent-blue: #3b82f6;
            --accent-purple: #8b5cf6;
            --accent-amber: #f59e0b;
            --square-light: #e2e8f0;
            --square-dark: #475569;
            --square-highlight: #fef08a;
            --square-move: #86efac;
            --text-light: #f8fafc;
            --text-dim: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(10px);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #334155;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.5rem;
            font-weight: bold;
            background: linear-gradient(135deg, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .main-container {
            display: flex;
            flex: 1;
            padding: 2rem;
            gap: 2rem;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }

        .sidebar {
            width: 320px;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 1.25rem;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3);
        }

        .card h2 {
            font-size: 1.1rem;
            margin-bottom: 1rem;
            color: #cbd5e1;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .mode-btn {
            width: 100%;
            padding: 0.8rem 1rem;
            margin-bottom: 0.6rem;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            color: var(--text-light);
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.95rem;
        }

        .mode-btn i {
            font-size: 1.2rem;
            width: 24px;
            text-align: center;
        }

        .mode-btn:hover {
            border-color: var(--accent-blue);
            background: #1e293b;
        }

        .mode-btn.active {
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            border-color: transparent;
            font-weight: bold;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }

        .board-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1rem;
        }

        .status-banner {
            background: #1e293b;
            padding: 0.75rem 1.5rem;
            border-radius: 30px;
            border: 1px solid #334155;
            font-size: 1rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            min-height: 48px;
        }

        .board-wrapper {
            position: relative;
            width: 560px;
            height: 560px;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5), 0 8px 10px -6px rgba(0,0,0,0.5);
            border: 6px solid #334155;
        }

        .chessboard {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            width: 100%;
            height: 100%;
        }

        .square {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 3rem;
            cursor: pointer;
            transition: background-color 0.15s;
        }

        .square.light { background-color: var(--square-light); }
        .square.dark { background-color: var(--square-dark); }

        .square.selected { background-color: var(--square-highlight) !important; }
        .square.valid-move::after {
            content: '';
            position: absolute;
            width: 18px;
            height: 18px;
            background-color: rgba(34, 197, 94, 0.7);
            border-radius: 50%;
        }

        .square.valid-capture::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            border: 4px solid rgba(239, 68, 68, 0.7);
            box-sizing: border-box;
        }

        .square.fogged {
            background-color: #090d16 !important;
            cursor: not-allowed;
        }
        .square.fogged * {
            display: none !important;
        }

        .square.portal {
            animation: portalPulse 2s infinite alternate;
        }
        @keyframes portalPulse {
            0% { box-shadow: inset 0 0 15px #a855f7; }
            100% { box-shadow: inset 0 0 25px #3b82f6; }
        }

        .piece {
            z-index: 2;
            transition: transform 0.1s ease;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.4));
        }

        .piece.white-piece {
            color: #ffffff;
            text-shadow: 0 0 2px #000, 0 0 4px #000;
        }

        .piece.black-piece {
            color: #111827;
            text-shadow: 0 0 1px #fff;
        }

        .piece.blindfold {
            opacity: 0 !important;
        }

        .info-panel {
            width: 300px;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .controls {
            display: flex;
            gap: 0.5rem;
        }

        .btn-action {
            flex: 1;
            padding: 0.75rem;
            background-color: #3b82f6;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background 0.2s;
        }

        .btn-action:hover { background-color: #2563eb; }
        .btn-danger { background-color: #ef4444; }
        .btn-danger:hover { background-color: #dc2626; }

        .move-history {
            flex: 1;
            max-height: 380px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 0.9rem;
            color: #cbd5e1;
        }

        .move-row {
            display: flex;
            padding: 0.4rem 0.6rem;
            border-bottom: 1px solid #334155;
        }

        .move-row:nth-child(even) { background-color: rgba(0,0,0,0.15); }
        .move-num { width: 40px; color: var(--text-dim); }
        .move-white, .move-black { flex: 1; }

        .event-toast {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #f59e0b, #ef4444);
            color: white;
            padding: 0.6rem 1.2rem;
            border-radius: 20px;
            font-weight: bold;
            box-shadow: 0 10px 20px rgba(0,0,0,0.4);
            opacity: 0;
            transition: opacity 0.3s, transform 0.3s;
            pointer-events: none;
            z-index: 10;
        }

        .event-toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(10px);
        }

        select {
            background: #0f172a;
            color: white;
            border: 1px solid #334155;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 0.9rem;
            width: 100%;
            margin-top: 8px;
        }

        @media (max-width: 1100px) {
            .main-container {
                flex-direction: column;
                align-items: center;
            }
            .sidebar, .info-panel {
                width: 100%;
                max-width: 560px;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <i class="fa-solid fa-chess-queen"></i>
            <span>Rogetic Chess Lab</span>
        </div>
        <div style="color: var(--text-dim); font-size: 0.9rem;">
            Experiència d'escacs única i personalitzada
        </div>
    </header>

    <div class="main-container">
        <!-- Sidebar Modes -->
        <div class="sidebar">
            <div class="card">
                <h2><i class="fa-solid fa-gamepad"></i> Selecciona Mode</h2>
                <button class="mode-btn active" onclick="setMode('classic')">
                    <i class="fa-solid fa-chess" style="color: #60a5fa;"></i>
                    <div>
                        <strong>Escacs Clàssics</strong>
                        <div style="font-size: 0.75rem; color: #94a3b8;">Regles estàndard 1v1 o vs Bot</div>
                    </div>
                </button>
                <button class="mode-btn" onclick="setMode('fog')">
                    <i class="fa-solid fa-smog" style="color: #a78bfa;"></i>
                    <div>
                        <strong>Boira de Guerra</strong>
                        <div style="font-size: 0.75rem; color: #94a3b8;">Només veus on pots moure</div>
                    </div>
                </button>
                <button class="mode-btn" onclick="setMode('chaos')">
                    <i class="fa-solid fa-bolt" style="color: #facc15;"></i>
                    <div>
                        <strong>Modi Caos</strong>
                        <div style="font-size: 0.75rem; color: #94a3b8;">Esdeveniments bojos cada 3 torns</div>
                    </div>
                </button>
                <button class="mode-btn" onclick="setMode('blindfold')">
                    <i class="fa-solid fa-eye-slash" style="color: #f87171;"></i>
                    <div>
                        <strong>Entrenador a Cegues</strong>
                        <div style="font-size: 0.75rem; color: #94a3b8;">Peces invisibles per a la teva ment</div>
                    </div>
                </button>
                <button class="mode-btn" onclick="setMode('portal')">
                    <i class="fa-solid fa-circle-nodes" style="color: #38bdf8;"></i>
                    <div>
                        <strong>Portals Quàntics</strong>
                        <div style="font-size: 0.75rem; color: #94a3b8;">Caselles que et teletransporten</div>
                    </div>
                </button>
            </div>

            <div class="card">
                <h2><i class="fa-solid fa-robot"></i> Oponents</h2>
                <label style="display: flex; align-items: center; gap: 10px; cursor: pointer; font-size: 0.95rem;">
                    <input type="checkbox" id="ai-toggle" style="width: 18px; height: 18px;" onchange="toggleAI()">
                    Jugar contra el Bot (IA)
                </label>
                <select id="ai-difficulty">
                    <option value="1">Nivell: Fàcil (Tàctic)</option>
                    <option value="3" selected>Nivell: Mitjà / Alt (Minimax)</option>
                </select>
            </div>
        </div>

        <!-- Board Section -->
        <div class="board-section">
            <div class="status-banner" id="status-banner">
                <span id="status-text">Torn de les Blanques</span>
            </div>

            <div class="board-wrapper">
                <div class="event-toast" id="event-toast">💥 Esdeveniment especial!</div>
                <div class="chessboard" id="board"></div>
            </div>
        </div>

        <!-- Right Info Panel -->
        <div class="info-panel">
            <div class="card controls">
                <button class="btn-action" onclick="resetGame()">
                    <i class="fa-solid fa-rotate-right"></i> Reiniciar
                </button>
                <button class="btn-action btn-danger" onclick="undoMove()">
                    <i class="fa-solid fa-rotate-left"></i> Desfer
                </button>
            </div>

            <div class="card" style="flex: 1; display: flex; flex-direction: column;">
                <h2><i class="fa-solid fa-list-ol"></i> Historial de Moviments</h2>
                <div class="move-history" id="move-history">
                </div>
            </div>
        </div>
    </div>

    <script>
        const PIECES = {
            'p': '♟', 'r': '♜', 'n': '♞', 'b': '♝', 'q': '♛', 'k': '♚',
            'P': '♟', 'R': '♜', 'N': '♞', 'B': '♝', 'Q': '♛', 'K': '♚'
        };

        const PIECE_VALUES = { p: 100, n: 320, b: 330, r: 500, q: 900, k: 20000 };

        // Positional evaluation tables for smart positioning
        const pawnPST = [
            0,  0,  0,  0,  0,  0,  0,  0,
            50, 50, 50, 50, 50, 50, 50, 50,
            10, 10, 20, 30, 30, 20, 10, 10,
             5,  5, 10, 25, 25, 10,  5,  5,
             0,  0,  0, 20, 20,  0,  0,  0,
             5, -5,-10,  0,  0,-10, -5,  5,
             5, 10, 10,-20,-20, 10, 10,  5,
             0,  0,  0,  0,  0,  0,  0,  0
        ];

        const knightPST = [
            -50,-40,-30,-30,-30,-30,-40,-50,
            -40,-20,  0,  0,  0,  0,-20,-40,
            -30,  0, 10, 15, 15, 10,  0,-30,
            -30,  5, 15, 20, 20, 15,  5,-30,
            -30,  0, 15, 20, 20, 15,  0,-30,
            -30,  5, 10, 15, 15, 10,  5,-30,
            -40,-20,  0,  5,  5,  0,-20,-40,
            -50,-40,-30,-30,-30,-30,-40,-50
        ];

        let game = new Chess();
        let selectedSquare = null;
        let validMoves = [];
        let currentMode = 'classic';
        let vsAI = false;
        let portals = [];

        const boardEl = document.getElementById('board');
        const statusText = document.getElementById('status-text');
        const moveHistoryEl = document.getElementById('move-history');
        const eventToast = document.getElementById('event-toast');

        function init() {
            createBoard();
            renderBoard();
            updateStatus();
        }

        function createBoard() {
            boardEl.innerHTML = '';
            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    const squareName = String.fromCharCode(97 + c) + (8 - r);
                    const square = document.createElement('div');
                    square.className = `square ${(r + c) % 2 === 0 ? 'light' : 'dark'}`;
                    square.dataset.square = squareName;
                    square.addEventListener('click', () => handleSquareClick(squareName));
                    boardEl.appendChild(square);
                }
            }
        }

        function setMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
            event.currentTarget.classList.add('active');

            if (mode === 'portal') {
                setupPortals();
                showToast("🌀 S'han creat 2 portals quàntics al tauler!");
            } else {
                portals = [];
            }

            renderBoard();
        }

        function toggleAI() {
            vsAI = document.getElementById('ai-toggle').checked;
            if (vsAI && game.turn() === 'b') {
                makeAIMove();
            }
        }

        function setupPortals() {
            const validPortalSquares = ['c3', 'c6', 'd4', 'd5', 'e4', 'e5', 'f3', 'f6'];
            let p1 = validPortalSquares[Math.floor(Math.random() * validPortalSquares.length)];
            let p2 = validPortalSquares[Math.floor(Math.random() * validPortalSquares.length)];
            while (p1 === p2) {
                p2 = validPortalSquares[Math.floor(Math.random() * validPortalSquares.length)];
            }
            portals = [p1, p2];
        }

        function renderBoard() {
            const board = game.board();
            const visibleSquares = calculateVisibility();

            document.querySelectorAll('.square').forEach(el => {
                const sq = el.dataset.square;
                const col = sq.charCodeAt(0) - 97;
                const row = 8 - parseInt(sq[1]);
                const piece = board[row][col];

                el.innerHTML = '';
                el.classList.remove('selected', 'valid-move', 'valid-capture', 'fogged', 'portal');

                if (currentMode === 'portal' && portals.includes(sq)) {
                    el.classList.add('portal');
                }

                if (piece) {
                    const pieceEl = document.createElement('span');
                    pieceEl.className = `piece ${piece.color === 'w' ? 'white-piece' : 'black-piece'}`;
                    pieceEl.textContent = PIECES[piece.type];

                    if (currentMode === 'blindfold') {
                        pieceEl.classList.add('blindfold');
                    }

                    el.appendChild(pieceEl);
                }

                if (sq === selectedSquare) {
                    el.classList.add('selected');
                }

                if (validMoves.includes(sq)) {
                    if (piece) {
                        el.classList.add('valid-capture');
                    } else {
                        el.classList.add('valid-move');
                    }
                }

                if (currentMode === 'fog' && !visibleSquares.has(sq)) {
                    el.classList.add('fogged');
                }
            });
        }

        function calculateVisibility() {
            const visible = new Set();
            if (currentMode !== 'fog') return visible;

            const turnColor = game.turn();
            const board = game.board();

            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    const sq = String.fromCharCode(97 + c) + (8 - r);
                    const piece = board[r][c];

                    if (piece && piece.color === turnColor) {
                        visible.add(sq);
                        const moves = game.moves({ square: sq, verbose: true });
                        moves.forEach(m => visible.add(m.to));
                    }
                }
            }
            return visible;
        }

        function handleSquareClick(sq) {
            if (game.game_over()) return;

            if (selectedSquare === sq) {
                selectedSquare = null;
                validMoves = [];
                renderBoard();
                return;
            }

            if (selectedSquare) {
                const moveObj = { from: selectedSquare, to: sq, promotion: 'q' };
                const move = game.move(moveObj);

                if (move) {
                    selectedSquare = null;
                    validMoves = [];
                    onMoveExecuted(move);
                    return;
                }
            }

            const piece = game.get(sq);
            if (piece && piece.color === game.turn()) {
                selectedSquare = sq;
                const moves = game.moves({ square: sq, verbose: true });
                validMoves = moves.map(m => m.to);
            } else {
                selectedSquare = null;
                validMoves = [];
            }

            renderBoard();
        }

        function onMoveExecuted(move) {
            if (currentMode === 'portal' && portals.includes(move.to)) {
                const otherPortal = portals[0] === move.to ? portals[1] : portals[0];
                const targetPiece = game.get(move.to);

                if (!game.get(otherPortal)) {
                    game.remove(move.to);
                    game.put(targetPiece, otherPortal);
                    showToast(`🌀 Teletransportat de ${move.to} a ${otherPortal}!`);
                }
            }

            if (currentMode === 'chaos' && game.history().length % 3 === 0) {
                triggerChaosEvent();
            }

            renderBoard();
            updateStatus();
            updateHistory();

            if (vsAI && !game.game_over() && game.turn() === 'b') {
                setTimeout(makeAIMove, 200);
            }
        }

        function triggerChaosEvent() {
            const events = [
                { name: "⚡ Sobrecàrrega!", action: () => showToast("⚡ Totes les peces estan carregades d'energia!") },
                { name: "🔄 Inversió de Torn!", action: () => {
                    const fen = game.fen().split(' ');
                    fen[1] = fen[1] === 'w' ? 'b' : 'w';
                    game.load(fen.join(' '));
                    showToast("🔄 El temps s'ha plegat! Torn repetit!");
                }},
                { name: "💥 Bomba Atòmica!", action: () => {
                    showToast("💥 Atenció: Caos total al centre del tauler!");
                }}
            ];

            const ev = events[Math.floor(Math.random() * events.length)];
            ev.action();
        }

        /* --- ADVANCED MINIMAX AI ENGINE --- */

        function evaluateBoard(board) {
            let totalEvaluation = 0;
            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    const piece = board[r][c];
                    if (piece) {
                        let val = PIECE_VALUES[piece.type] || 0;
                        let idx = r * 8 + c;
                        if (piece.type === 'p') val += pawnPST[piece.color === 'w' ? idx : 63 - idx];
                        if (piece.type === 'n') val += knightPST[piece.color === 'w' ? idx : 63 - idx];

                        totalEvaluation += piece.color === 'w' ? val : -val;
                    }
                }
            }
            return totalEvaluation;
        }

        function minimax(depth, alpha, beta, isMaximizing) {
            if (depth === 0 || game.game_over()) {
                return evaluateBoard(game.board());
            }

            const moves = game.moves({ verbose: true });

            if (isMaximizing) {
                let maxEval = -Infinity;
                for (let move of moves) {
                    game.move(move);
                    let evaluation = minimax(depth - 1, alpha, beta, false);
                    game.undo();
                    maxEval = Math.max(maxEval, evaluation);
                    alpha = Math.max(alpha, evaluation);
                    if (beta <= alpha) break;
                }
                return maxEval;
            } else {
                let minEval = Infinity;
                for (let move of moves) {
                    game.move(move);
                    let evaluation = minimax(depth - 1, alpha, beta, true);
                    game.undo();
                    minEval = Math.min(minEval, evaluation);
                    beta = Math.min(beta, evaluation);
                    if (beta <= alpha) break;
                }
                return minEval;
            }
        }

        function makeAIMove() {
            const moves = game.moves({ verbose: true });
            if (moves.length === 0) return;

            const depth = parseInt(document.getElementById('ai-difficulty').value) || 3;
            let bestMove = null;
            let bestValue = Infinity; // Black is minimizing

            // Shuffle moves slightly so AI isn't completely deterministic
            moves.sort(() => Math.random() - 0.5);

            for (let move of moves) {
                game.move(move);
                let boardValue = minimax(depth - 1, -Infinity, Infinity, true);
                game.undo();

                if (boardValue < bestValue) {
                    bestValue = boardValue;
                    bestMove = move;
                }
            }

            if (bestMove) {
                const result = game.move(bestMove);
                onMoveExecuted(result);
            }
        }

        function updateStatus() {
            let status = '';
            const turn = game.turn() === 'w' ? 'Blanques' : 'Negres';

            if (game.in_checkmate()) {
                status = `👑 Escac i Mat! Guanyen les ${game.turn() === 'w' ? 'Negres' : 'Blanques'}.`;
            } else if (game.in_draw()) {
                status = '🤝 Taules / Empat!';
            } else {
                status = `Torn de les ${turn}`;
                if (game.in_check()) {
                    status += ' (¡ESCAC!)';
                }
            }

            statusText.textContent = status;
        }

        function updateHistory() {
            const history = game.history({ verbose: true });
            moveHistoryEl.innerHTML = '';

            for (let i = 0; i < history.length; i += 2) {
                const row = document.createElement('div');
                row.className = 'move-row';

                const num = document.createElement('div');
                num.className = 'move-num';
                num.textContent = `${Math.floor(i / 2) + 1}.`;

                const white = document.createElement('div');
                white.className = 'move-white';
                white.textContent = history[i].san;

                const black = document.createElement('div');
                black.className = 'move-black';
                black.textContent = history[i + 1] ? history[i + 1].san : '';

                row.appendChild(num);
                row.appendChild(white);
                row.appendChild(black);
                moveHistoryEl.appendChild(row);
            }

            moveHistoryEl.scrollTop = moveHistoryEl.scrollHeight;
        }

        function showToast(text) {
            eventToast.textContent = text;
            eventToast.classList.add('show');
            setTimeout(() => eventToast.classList.remove('show'), 2500);
        }

        function resetGame() {
            game.reset();
            selectedSquare = null;
            validMoves = [];
            if (currentMode === 'portal') setupPortals();
            renderBoard();
            updateStatus();
            updateHistory();
        }

        function undoMove() {
            game.undo();
            if (vsAI) game.undo();
            selectedSquare = null;
            validMoves = [];
            renderBoard();
            updateStatus();
            updateHistory();
        }

        init();
    </script>
</body>
</html>
