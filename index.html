<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SummarizerAI - Resum de Vídeos</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-dark: #0f0f11;
            --bg-card: #18181c;
            --accent-purple: #7c3aed;
            --accent-purple-hover: #6d28d9;
            --border-color: #27272a;
            --text-main: #f4f4f5;
            --text-muted: #a1a1aa;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--bg-dark); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        header { background: #121215; border-bottom: 1px solid var(--border-color); padding: 0.9rem 1.8rem; display: flex; justify-content: space-between; align-items: center; }
        .brand-logo { display: flex; align-items: center; gap: 10px; font-size: 1.3rem; font-weight: 700; color: #fff; text-decoration: none; }
        .brand-logo i { color: var(--accent-purple); font-size: 1.5rem; }

        .app-container { display: flex; flex: 1; height: calc(100vh - 65px); gap: 1.5rem; padding: 1.5rem; max-width: 1400px; margin: 0 auto; width: 100%; }

        .video-section { flex: 1.2; display: flex; flex-direction: column; gap: 1rem; }
        .input-box { display: flex; gap: 10px; background: var(--bg-card); padding: 8px 12px; border: 1px solid var(--border-color); border-radius: 10px; }
        .input-box input { flex: 1; background: transparent; border: none; color: #fff; outline: none; font-size: 0.95rem; }
        .btn-analyze { background: var(--accent-purple); color: #fff; border: none; padding: 10px 18px; border-radius: 8px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
        .btn-analyze:hover { background: var(--accent-purple-hover); }

        .video-wrapper { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 12px; overflow: hidden; border: 1px solid var(--border-color); }
        .video-wrapper iframe { width: 100%; height: 100%; border: none; }

        .summary-section { flex: 1; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; padding: 1.5rem; display: flex; flex-direction: column; gap: 1rem; overflow-y: auto; }
        .summary-title { font-size: 1.1rem; font-weight: 700; display: flex; align-items: center; gap: 8px; color: var(--accent-purple); border-bottom: 1px solid var(--border-color); padding-bottom: 0.8rem; }

        .summary-content { line-height: 1.6; font-size: 0.95rem; color: #e4e4e7; }
        .summary-content h3 { margin-top: 1rem; margin-bottom: 0.5rem; font-size: 1rem; color: #fff; }
        .summary-content ul { padding-left: 1.2rem; margin-bottom: 1rem; }
        .summary-content li { margin-bottom: 0.4rem; }

        .timestamp-tag { display: inline-block; background: rgba(124, 58, 237, 0.2); color: #a78bfa; padding: 2px 8px; border-radius: 4px; font-family: monospace; font-size: 0.85rem; font-weight: 600; margin-right: 6px; }
    </style>
</head>
<body>

    <header>
        <a href="#" class="brand-logo"><i class="fa-solid fa-wand-magic-sparkles"></i><span>SummarizerAI</span></a>
    </header>

    <div class="app-container">
        <!-- Secció de Vídeo -->
        <section class="video-section">
            <div class="input-box">
                <input type="text" id="videoUrl" placeholder="Enganxa l'enllaç de YouTube o el nom del tema...">
                <button class="btn-analyze" onclick="processVideo()"><i class="fa-solid fa-bolt"></i> Generar Resum</button>
            </div>

            <div class="video-wrapper">
                <iframe id="videoPlayer" src="https://www.youtube.com/embed/dQw4w9WgXcQ" allowfullscreen></iframe>
            </div>
        </section>

        <!-- Secció de Resum -->
        <section class="summary-section">
            <div class="summary-title"><i class="fa-solid fa-file-lines"></i> Esquema i Apunts del Vídeo</div>
            <div class="summary-content" id="summaryOutput">
                <p style="color: var(--text-muted);">Introdueix un tema o enllaç de vídeo per generar el resum executiu, punts clau i esquema per minuts.</p>
            </div>
        </section>
    </div>

    <script>
        async function processVideo() {
            const input = document.getElementById('videoUrl').value.trim();
            if (!input) return;

            const summaryOutput = document.getElementById('summaryOutput');
            const videoPlayer = document.getElementById('videoPlayer');

            summaryOutput.innerHTML = `<p style="color:var(--accent-purple);"><em><i class="fa-solid fa-spinner fa-spin"></i> Analitzant el vídeo i generant l'esquema...</em></p>`;

            // Carregar el vídeo al reproductor
            let videoId = extractYouTubeId(input);
            if (videoId) {
                videoPlayer.src = `https://www.youtube.com/embed/${videoId}`;
            } else {
                videoPlayer.src = `https://www.youtube-nocookie.com/embed/?listType=search&list=${encodeURIComponent(input)}`;
            }

            const prompt = `Fes un resum i esquema en català per al tema o vídeo: "${input}". 
            Organitza la resposta així:
            1. Resum executiu (2-3 frases).
            2. Punts clau amb minuts ficticis en format [00:00].
            3. Conclusions principals.
            Utilitza etiquetes HTML com <h3>, <ul>, <li> i <span class='timestamp-tag'>.`;

            const summaryHTML = await fetchAISummary(prompt);
            summaryOutput.innerHTML = summaryHTML;
        }

        function extractYouTubeId(url) {
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        // Nova crida GET gratuïta sense restricció d'API key
        async function fetchAISummary(promptText) {
            try {
                const encodedPrompt = encodeURIComponent(promptText);
                const response = await fetch(`https://text.pollinations.ai/${encodedPrompt}?model=openai`);

                if (!response.ok) throw new Error("Error en la resposta");

                let text = await response.text();
                return text;
            } catch (err) {
                return `<p style="color:#ff6b6b;">Hi ha hagut un error en comunicar amb la IA. Torna-ho a provar en uns segons.</p>`;
            }
        }
    </script>
</body>
</html>
