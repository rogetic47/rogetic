<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamAI - Assistent de Vídeo</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-dark: #0f0f0f;
            --bg-card: #181818;
            --bg-card-hover: #222222;
            --accent-red: #ff0000;
            --accent-red-hover: #cc0000;
            --border-color: #272727;
            --text-main: #f1f1f1;
            --text-muted: #aaa;
            --chat-user-bg: #272727;
            --chat-ai-bg: #1f1f1f;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--bg-dark); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        header { background: #0f0f0f; border-bottom: 1px solid var(--border-color); padding: 0.9rem 1.8rem; display: flex; justify-content: space-between; align-items: center; z-index: 100; }
        .brand-logo { display: flex; align-items: center; gap: 10px; font-size: 1.3rem; font-weight: 700; color: #fff; text-decoration: none; }
        .brand-logo i { color: var(--accent-red); font-size: 1.6rem; }

        .app-container { display: flex; flex: 1; height: calc(100vh - 65px); max-width: 1000px; margin: 0 auto; width: 100%; }

        .chat-container { flex: 1; display: flex; flex-direction: column; background: var(--bg-dark); }
        .chat-messages { flex: 1; padding: 1.8rem; overflow-y: auto; display: flex; flex-direction: column; gap: 1.5rem; }
        
        .message { display: flex; gap: 14px; max-width: 90%; }
        .message.user { align-self: flex-end; flex-direction: row-reverse; }
        
        .avatar { width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1rem; flex-shrink: 0; }
        .user .avatar { background: #383838; color: #fff; }
        .ai .avatar { background: var(--accent-red); color: #fff; }

        .msg-content { background: var(--chat-ai-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 1rem 1.2rem; font-size: 0.95rem; line-height: 1.5; color: var(--text-main); width: 100%; }
        .user .msg-content { background: var(--chat-user-bg); border-color: transparent; }

        /* Estils per al reproductor de vídeo integrat */
        .video-container { position: relative; width: 100%; padding-bottom: 56.25%; height: 0; margin-top: 12px; border-radius: 8px; overflow: hidden; background: #000; border: 1px solid var(--border-color); }
        .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }

        .video-actions { display: flex; gap: 10px; margin-top: 12px; }
        .yt-btn { display: inline-flex; align-items: center; gap: 8px; background: var(--accent-red); color: #fff; padding: 10px 16px; border-radius: 20px; text-decoration: none; font-size: 0.88rem; font-weight: 600; transition: background 0.2s; }
        .yt-btn:hover { background: var(--accent-red-hover); }

        .chat-input-area { padding: 1.2rem; background: var(--bg-dark); border-top: 1px solid var(--border-color); display: flex; gap: 12px; align-items: center; }
        .chat-input-area textarea { flex: 1; background: #222; border: 1px solid var(--border-color); border-radius: 24px; padding: 12px 20px; color: var(--text-main); font-family: inherit; font-size: 0.95rem; resize: none; height: 48px; outline: none; }
        .chat-input-area textarea:focus { border-color: #555; }
        .send-btn { background: var(--accent-red); color: #fff; border: none; border-radius: 50%; width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 1.1rem; transition: background 0.2s; }
        .send-btn:hover { background: var(--accent-red-hover); }
    </style>
</head>
<body>

    <header>
        <a href="#" class="brand-logo"><i class="fa-brands fa-youtube"></i><span>StreamAI</span></a>
    </header>

    <div class="app-container">
        <main class="chat-container">
            <div class="chat-messages" id="chatMessages">
                <div class="message ai">
                    <div class="avatar"><i class="fa-solid fa-play"></i></div>
                    <div class="msg-content">
                        <p><strong>Hola! Què vols veure avui?</strong></p>
                        <p>Diga'm quin vídeo o tema cerques i te'l posaré directament aquí reproduint-se.</p>
                    </div>
                </div>
            </div>

            <div class="chat-input-area">
                <textarea id="userInput" placeholder="Escriu el tema del vídeo (ex: trailer gta 6, resum champions, tutorial pypython...)" onkeydown="handleKeyDown(event)"></textarea>
                <button class="send-btn" onclick="sendMessage()"><i class="fa-solid fa-paper-plane"></i></button>
            </div>
        </main>
    </div>

    <script>
        function handleKeyDown(e) { 
            if (e.key === 'Enter' && !e.shiftKey) { 
                e.preventDefault(); 
                sendMessage(); 
            } 
        }

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            if (!text) return;

            appendMessage('user', text);
            input.value = '';

            const loadingId = appendLoadingMessage();

            // Obtenir el vídeo directament mitjançant la cerca
            const videoData = await fetchDirectVideo(text);

            removeLoadingMessage(loadingId);
            appendVideoMessage('ai', videoData);
        }

        function appendMessage(sender, content) {
            const chatMessages = document.getElementById('chatMessages');
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${sender}`;
            const avatarIcon = sender === 'user' ? 'fa-user' : 'fa-play';
            msgDiv.innerHTML = `<div class="avatar"><i class="fa-solid ${avatarIcon}"></i></div><div class="msg-content"><p>${content}</p></div>`;
            chatMessages.appendChild(msgDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function appendLoadingMessage() {
            const id = 'loading-' + Date.now();
            const chatMessages = document.getElementById('chatMessages');
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message ai';
            msgDiv.id = id;
            msgDiv.innerHTML = `<div class="avatar"><i class="fa-solid fa-play"></i></div><div class="msg-content"><em>Cercant i carregant el vídeo directament... 🎬</em></div>`;
            chatMessages.appendChild(msgDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
            return id;
        }

        function removeLoadingMessage(id) {
            const el = document.getElementById(id);
            if (el) el.remove();
        }

        function appendVideoMessage(sender, videoData) {
            const chatMessages = document.getElementById('chatMessages');
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${sender}`;
            
            msgDiv.innerHTML = `
                <div class="avatar"><i class="fa-solid fa-play"></i></div>
                <div class="msg-content">
                    <p>Aquí tens el vídeo sobre <strong>${videoData.title}</strong>:</p>
                    
                    <div class="video-container">
                        <iframe src="${videoData.embedUrl}" allowfullscreen></iframe>
                    </div>

                    <div class="video-actions">
                        <a href="${videoData.watchUrl}" target="_blank" class="yt-btn">
                            <i class="fa-brands fa-youtube"></i> Obrir directament a YouTube
                        </a>
                    </div>
                </div>
            `;
            chatMessages.appendChild(msgDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        // Cerca i genera l'enllaç de reproducció directa (Embed) de YouTube
        async function fetchDirectVideo(query) {
            try {
                // Utilitzem un servei de cerca d'IDs de vídeo de YouTube lliure
                const response = await fetch(`https://pipedapi.kavin.rocks/search?q=${encodeURIComponent(query)}&filter=videos`);
                const data = await response.json();
                
                if (data.items && data.items.length > 0) {
                    const video = data.items[0];
                    const videoId = video.url.split('v=')[1];
                    return {
                        title: video.title,
                        embedUrl: `https://www.youtube.com/embed/${videoId}?autoplay=1`,
                        watchUrl: `https://www.youtube.com/watch?v=${videoId}`
                    };
                }
            } catch (e) {
                console.log("Fallback a cerca per motor intern");
            }

            // Si falla la cerca en temps real, utilitza el cercador intern directe per encastat
            const q = encodeURIComponent(query);
            return {
                title: query,
                embedUrl: `https://www.youtube-nocookie.com/embed/?listType=search&list=${q}`,
                watchUrl: `https://www.youtube.com/results?search_query=${q}`
            };
        }
    </script>
</body>
</html>
